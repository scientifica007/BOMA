name: BOMA ST2-EXP-014 Cauchy-Native Full C — V5

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'LAB/PDSA/PDSA-ST2-EXP-014_CAUCHY_NATIVE_FULL_C.md'
      - 'LAB/PDSA/experiments/ST2-EXP-014_*'
      - '!LAB/PDSA/experiments/ST2-EXP-014_TO_ST2-EXP-015_AUTONOMOUS_TRANSITION_*.json'
      - 'LAB/payloads/lean/CStage/ST2Exp014*.lean'
      - 'LAB/20_FORMALIZATION/C_STAGE/ST2_EXP_014_*'
      - '.github/workflows/boma-st2-exp-014-cauchy-native-full-c.yml'
  push:
    branches:
      - 'feature/stage-two-st2-exp-014-*'

concurrency:
  group: boma-st2-exp-014-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify native nine-Claim C closure over Cauchy R
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact experimental head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head, frozen baseline, and immutable Plan
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          baseline="fff2400b65b2c9a260fb28defd907ce24387cb80"
          frozen="788ae14649f3245fd8d6ccd43f90038ffba7762b"
          plan=LAB/PDSA/PDSA-ST2-EXP-014_CAUCHY_NATIVE_FULL_C.md
          test "$actual" = "$expected"
          git merge-base --is-ancestor "$baseline" HEAD
          git merge-base --is-ancestor "$frozen" HEAD
          git diff --exit-code "$frozen" HEAD -- "$plan"
          test "$(git show "$frozen:$plan" | git hash-object --stdin)" = "$(git hash-object "$plan")"
          {
            printf 'expected_head=%s\n' "$expected"
            printf 'verified_head=%s\n' "$actual"
            printf 'baseline=%s\n' "$baseline"
            printf 'frozen_plan_commit=%s\n' "$frozen"
          } | tee /tmp/st2-exp-014-provenance.txt

      - name: Verify owner program authority and lifecycle-compatible 014 state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/st2-exp-014-program-state.txt
          import json
          from pathlib import Path
          state = json.loads(Path('LAB/PDSA/AUTONOMOUS_RESEARCH_PROGRAM_STATE_001.json').read_text())
          manifest = json.loads(Path('LAB/PDSA/ST2_RP_001_PROGRAM_MANIFEST_001.json').read_text())
          assert state['active_program_id'] == 'ST2-RP-001'
          assert state['authorized_experiment_queue'] == ['ST2-EXP-014','ST2-EXP-015','ST2-EXP-016','ST2-EXP-017']
          assert manifest['program_id'] == 'ST2-RP-001'
          assert manifest['queue_order'] == state['authorized_experiment_queue']
          rec = manifest['experiments'][0]
          assert rec['experiment_id'] == 'ST2-EXP-014'
          assert rec['origin_kind'] == 'DEPENDENCY_EDGE'
          assert rec['origin_id'] == 'BOMA-C-R-DEP-001'
          if state.get('active_experiment') == 'ST2-EXP-014':
              assert state['state'] in {'PLAN_FROZEN','DO','WAITING_CI','RECOVERY_ALLOWED','STUDY','ACT','CLOSING'}
              assert state['queue_cursor'] == 0
              assert state['active_frozen_plan_sha'] == '788ae14649f3245fd8d6ccd43f90038ffba7762b'
              assert state['active_experiment_frozen_reference_sha'] == 'fff2400b65b2c9a260fb28defd907ce24387cb80'
              lifecycle_mode = 'ACTIVE_014'
          else:
              frontier = state.get('current_stage_two_frontier', {})
              assert frontier.get('latest_completed_experiment') == 'ST2-EXP-014'
              assert str(frontier.get('latest_completed_status', '')).startswith('CLOSED_PASS')
              assert state['state'] in {
                  'TRANSITION_GATE','PREPARING_EXPERIMENT','PLAN_FROZEN','DO','WAITING_CI',
                  'RECOVERY_ALLOWED','STUDY','ACT','CLOSING','PROGRAM_COMPLETE','OWNER_REQUIRED'
              }
              lifecycle_mode = 'POST_014_CLOSED'
          print('program=ST2-RP-001')
          print('lifecycle_mode=' + lifecycle_mode)
          print('state=' + state['state'])
          PY

      - name: Prove accepted Q/R/C manifests and sources remain frozen controls
        shell: bash
        run: |
          set -euo pipefail
          baseline="fff2400b65b2c9a260fb28defd907ce24387cb80"
          manifests=(
            LAB/20_FORMALIZATION/Q_STAGE/Q_ACCEPTED_INPUTS.txt
            LAB/20_FORMALIZATION/R_STAGE/R_INTEGRATION_002_INPUTS.txt
            LAB/20_FORMALIZATION/C_STAGE/C_ACCEPTED_INPUTS.txt
          )
          : > /tmp/st2-exp-014-accepted-immutability.txt
          for manifest in "${manifests[@]}"; do
            test -s "$manifest"
            git diff --exit-code "$baseline" HEAD -- "$manifest"
            printf 'manifest unchanged: %s\n' "$manifest" >> /tmp/st2-exp-014-accepted-immutability.txt
            while IFS= read -r src || [ -n "$src" ]; do
              [ -z "$src" ] && continue
              test -f "$src"
              git diff --exit-code "$baseline" HEAD -- "$src"
              printf 'source unchanged: %s\n' "$src" >> /tmp/st2-exp-014-accepted-immutability.txt
            done < "$manifest"
          done
          cat /tmp/st2-exp-014-accepted-immutability.txt

      - name: Gate A — verify exact nine-Claim gap inventory
        shell: bash
        run: |
          set -euo pipefail
          baseline=fff2400b65b2c9a260fb28defd907ce24387cb80
          spec=LAB/00_ARCHITECTURE/C_ACCEPTANCE_SPECIFICATION.md
          registry=LAB/00_ARCHITECTURE/CLAIM_REGISTRY.md
          gap=LAB/PDSA/experiments/ST2-EXP-014_GATE_A_CLAIM_GAP_001.md
          test -s "$spec"
          test -s "$registry"
          test -s "$gap"
          git diff --exit-code "$baseline" HEAD -- "$spec" "$registry"
          claims=(
            C-CL-CARRIER-001
            C-CL-REMBED-001
            C-CL-FIELD-001
            C-CL-I-001
            C-CL-GEN-001
            C-CL-COORDUNIQ-001
            C-CL-NONREAL-001
            C-CL-COMPARE-001
            C-CL-INTEGRATION-001
          )
          : > /tmp/st2-exp-014-gate-a-claims.txt
          for claim in "${claims[@]}"; do
            grep -Fq "$claim" "$registry"
            grep -Fq "$claim" "$gap"
            printf '%s PRESENT\n' "$claim" >> /tmp/st2-exp-014-gate-a-claims.txt
          done
          test "$(grep -c 'H6_ALREADY_VERIFIED' "$gap")" -ge 7
          grep -Fq '011_ALREADY_VERIFIED' "$gap"
          grep -Fq '014_INTEGRATION_ONLY' "$gap"
          cat /tmp/st2-exp-014-gate-a-claims.txt

      - name: Validate native manifest separation and selector firewall
        shell: bash
        run: |
          set -euo pipefail
          independent=LAB/20_FORMALIZATION/R_STAGE/ST2_EXP_003_CAUCHY_INDEPENDENT_INPUTS.txt
          h6=LAB/20_FORMALIZATION/C_STAGE/ST2_EXP_003_CAUCHY_QUADRATIC_REBUILD_INPUTS.txt
          native=LAB/20_FORMALIZATION/C_STAGE/ST2_EXP_014_CAUCHY_NATIVE_FULL_C_INPUTS.txt
          generic=LAB/payloads/lean/CStage/ST2Exp011GenericQuadraticComparison.lean
          h6adapter=LAB/payloads/lean/CStage/ST2Exp011CauchyH6Comparison.lean
          source=LAB/payloads/lean/CStage/ST2Exp014CauchyNativeFullC.lean
          for f in "$independent" "$h6" "$native" "$generic" "$h6adapter" "$source"; do
            test -s "$f"
          done
          test "$(sed -n '1p' "$native")" = "$generic"
          test "$(sed -n '2p' "$native")" = "$h6adapter"
          test "$(sed -n '3p' "$native")" = "$source"
          test "$(wc -l < "$native" | tr -d ' ')" = "3"

          if grep -En 'RDedekind|RStageIntegration002|/CStage/' "$independent"; then
            printf 'Independent Cauchy real manifest lost route separation\n' >&2
            exit 1
          fi

          forbidden='ST2Exp003DedekindCauchyFieldIsomorphism|cToD|dToC|RStageIntegration002|BOMA\.R\.Dedekind|Classical\.choose|(^|[^[:alnum:]_])(sorry|axiom)([^[:alnum:]_]|$)'
          if grep -En "$forbidden" "$source" "$h6adapter"; then
            printf '014 native source crossed H5/Dedekind/selector boundary\n' >&2
            exit 1
          fi
          if grep -En 'BOMA\.R\.|RBOMA|RCBOMA|CCBOMA|Dedekind|Cauchy' "$generic"; then
            printf '011 generic comparison source lost scalar-name independence\n' >&2
            exit 1
          fi
          {
            printf 'independent_real_manifest=%s\n' "$independent"
            printf 'h6_manifest=%s\n' "$h6"
            printf '014_manifest=%s\n' "$native"
            printf 'native full-C source excludes H5/Dedekind implementation transport\n'
          } | tee /tmp/st2-exp-014-source-boundary.txt

      - name: Setup pinned Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Prove native nine-Claim Cauchy full-C certificate
        shell: bash
        run: |
          set -euo pipefail
          target=/tmp/BOMAST2Exp014CauchyNativeFullC.lean
          : > "$target"
          for manifest in \
            LAB/20_FORMALIZATION/R_STAGE/ST2_EXP_003_CAUCHY_INDEPENDENT_INPUTS.txt \
            LAB/20_FORMALIZATION/C_STAGE/ST2_EXP_003_CAUCHY_QUADRATIC_REBUILD_INPUTS.txt \
            LAB/20_FORMALIZATION/C_STAGE/ST2_EXP_014_CAUCHY_NATIVE_FULL_C_INPUTS.txt; do
            while IFS= read -r src || [ -n "$src" ]; do
              [ -z "$src" ] && continue
              test -f "$src"
              cat "$src" >> "$target"
              printf '\n' >> "$target"
            done < "$manifest"
          done
          cat >> "$target" <<'EOF'
          #print axioms BOMA.C.StageTwo.CauchyQuadratic003.cauchyQuadraticFieldCertificate
          #print axioms BOMA.C.StageTwo.ComparisonInterface011.NativeCauchy.h6NativeSelfComparison
          #print axioms BOMA.C.StageTwo.CauchyNativeFullC014.cauchyNativeComparison
          #print axioms BOMA.C.StageTwo.CauchyNativeFullC014.cauchyNativeFunctionalComparison
          #print axioms BOMA.C.StageTwo.CauchyNativeFullC014.claim_rembed_injective
          #print axioms BOMA.C.StageTwo.CauchyNativeFullC014.claim_i_squared
          #print axioms BOMA.C.StageTwo.CauchyNativeFullC014.claim_generated
          #print axioms BOMA.C.StageTwo.CauchyNativeFullC014.claim_coordinate_unique
          #print axioms BOMA.C.StageTwo.CauchyNativeFullC014.claim_imaginary_not_real
          #print axioms BOMA.C.StageTwo.CauchyNativeFullC014.cauchyNativeFullCCertificate
          EOF
          lake env lean "$target" 2>&1 | tee /tmp/st2-exp-014-native-full-c-lean.log

      - name: Extract native full-C declaration closure
        shell: bash
        run: |
          set -euo pipefail
          all=LAB/20_FORMALIZATION/C_STAGE/ST2_EXP_014_ALL_TEMP_INPUTS.txt
          trap 'rm -f "$all"' EXIT
          cat \
            LAB/20_FORMALIZATION/R_STAGE/ST2_EXP_003_CAUCHY_INDEPENDENT_INPUTS.txt \
            LAB/20_FORMALIZATION/C_STAGE/ST2_EXP_003_CAUCHY_QUADRATIC_REBUILD_INPUTS.txt \
            LAB/20_FORMALIZATION/C_STAGE/ST2_EXP_014_CAUCHY_NATIVE_FULL_C_INPUTS.txt \
            > "$all"

          python3 LAB/00_ARCHITECTURE/tools/lean_dependency_audit.py \
            --stage C --manifest "$all" \
            --target BOMA.C.StageTwo.CauchyNativeFullC014.cauchyNativeFullCCertificate \
            --json-out /tmp/st2-exp-014-full-c-closure.json \
            > /tmp/st2-exp-014-full-c-dependency-audit.log

          python3 LAB/00_ARCHITECTURE/tools/lean_dependency_audit.py \
            --stage C --manifest "$all" \
            --target BOMA.C.StageTwo.CauchyNativeFullC014.cauchyNativeComparison \
            --json-out /tmp/st2-exp-014-comparison-closure.json \
            > /tmp/st2-exp-014-comparison-dependency-audit.log

          forbidden='ST2Exp003DedekindCauchyFieldIsomorphism|RStageIntegration002|BOMA\.R\.Dedekind|cToD|dToC'
          if grep -En "$forbidden" /tmp/st2-exp-014-full-c-closure.json /tmp/st2-exp-014-comparison-closure.json; then
            printf 'Native 014 declaration closure contains forbidden H5/Dedekind implementation dependency\n' >&2
            exit 1
          fi
          cat /tmp/st2-exp-014-full-c-closure.json

      - name: Run autonomous-program and architecture regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 LAB/PDSA/tools/autonomous_research_program_audit.py \
            | tee /tmp/st2-exp-014-autonomy-audit.txt
          python3 LAB/00_ARCHITECTURE/tools/architecture_consistency_audit.py \
            | tee /tmp/st2-exp-014-architecture-audit.txt

      - name: Publish exact 014 scope
        if: always()
        shell: bash
        run: |
          {
            printf '## ST2-EXP-014 — Cauchy-native full C\n'
            printf -- '- Exact head: `%s`\n' "$(git rev-parse HEAD)"
            printf -- '- Frozen Plan: `788ae14649f3245fd8d6ccd43f90038ffba7762b`.\n'
            printf -- '- Single factor: Dedekind RBOMA scalar producer → verified Cauchy RCBOMA; C Route-P meaning fixed.\n'
            printf -- '- Target: all nine accepted C Claim meanings in a research-only native Cauchy closure.\n'
            printf -- '- Native implementation forbids H5/Dedekind transport and preserves witness-only inverse + relation/function firewall.\n'
            printf -- '- No accepted route/export/contract is changed by this workflow.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve ST2-EXP-014 exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st2-exp-014-cauchy-native-full-c-${{ github.run_id }}
          path: |
            /tmp/st2-exp-014-provenance.txt
            /tmp/st2-exp-014-program-state.txt
            /tmp/st2-exp-014-accepted-immutability.txt
            /tmp/st2-exp-014-gate-a-claims.txt
            /tmp/st2-exp-014-source-boundary.txt
            /tmp/st2-exp-014-native-full-c-lean.log
            /tmp/st2-exp-014-full-c-closure.json
            /tmp/st2-exp-014-full-c-dependency-audit.log
            /tmp/st2-exp-014-comparison-closure.json
            /tmp/st2-exp-014-comparison-dependency-audit.log
            /tmp/st2-exp-014-autonomy-audit.txt
            /tmp/st2-exp-014-architecture-audit.txt
          if-no-files-found: warn
          retention-days: 30
