name: BOMA Autonomy Bootstrap Installer 001

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/boma_autonomy_bundle.py'
      - 'bootstrap/chunks/**'
      - '.github/workflows/boma-autonomy-bootstrap-install.yml'

permissions:
  contents: write

concurrency:
  group: boma-autonomy-bootstrap-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install pre-START autonomy payload
        run: python3 bootstrap/boma_autonomy_bundle.py

      - name: Validate installed autonomy infrastructure
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/boma_autonomy/*.py
          python3 scripts/boma_autonomy/validate.py
          python3 -m unittest discover -s tests/boma_autonomy -v

      - name: Persist non-workflow bootstrap infrastructure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "BOMA Autonomy Bootstrap"
          git config user.email "actions@users.noreply.github.com"

          # The default GITHUB_TOKEN for this fork cannot create/update workflow
          # files. Keep the temporary carrier and current workflows unchanged in
          # this automated commit. Validated workflow changes are installed
          # separately through the repository write channel.
          git restore --source=HEAD -- .github/workflows bootstrap
          git clean -fd -- .github/workflows

          # Compilation/tests are validation evidence, not repository artifacts.
          find scripts tests -type d -name __pycache__ -prune -exec rm -rf {} +

          git add -A
          if git diff --cached --quiet; then
            echo "No non-workflow bootstrap changes to persist."
            exit 0
          fi
          git commit -m "bootstrap: install BOMA autonomy runtime core"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
