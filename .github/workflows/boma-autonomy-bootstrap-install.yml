name: BOMA Autonomy Bootstrap Installer 001

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/boma_autonomy_bundle.py'
      - '.github/workflows/boma-autonomy-bootstrap-install.yml'

permissions:
  contents: write

concurrency:
  group: boma-autonomy-bootstrap-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install pre-START autonomy payload
        run: python3 bootstrap/boma_autonomy_bundle.py

      - name: Validate installed Python and YAML syntax
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/boma_autonomy/*.py
          python3 - <<'PY2'
          import pathlib, yaml
          for path in pathlib.Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          PY2

      - name: Commit installed bootstrap infrastructure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "BOMA Autonomy Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "bootstrap: install BOMA autonomous research engine"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
