name: BOMA ST2-EXP-016 — frozen Plan Gates A B C norm bridge

on:
  pull_request:
    branches: [main]
    paths:
      - 'LAB/payloads/lean/CStage/ST2Exp016*.lean'
      - 'LAB/20_FORMALIZATION/C_STAGE/ST2_EXP_016*'
      - 'LAB/00_ARCHITECTURE/tools/st2_exp_016_do_gate_abc.py'
      - 'LAB/PDSA/experiments/ST2-EXP-016*'
      - 'LAB/PDSA/AUTONOMOUS_RESEARCH_PROGRAM_STATE_001.json'
      - '.github/workflows/boma-st2-exp-016-norm-bridge.yml'
  push:
    branches:
      - 'feature/stage-two-st2-exp-016-*'

permissions:
  contents: read

concurrency:
  group: st2-exp-016-norm-bridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify 016 frozen Plan, seven controls and algebraic norm bridge
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact head and historical full ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup pinned Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Independent Gate A B C verification — no G8
        env:
          BOMA_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 LAB/00_ARCHITECTURE/tools/st2_exp_016_do_gate_abc.py --out /tmp/boma-st2-exp-016-gates-abc
      - name: Preserve exact-head gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st2-exp-016-gates-abc-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/boma-st2-exp-016-gates-abc
          if-no-files-found: warn
          retention-days: 90
