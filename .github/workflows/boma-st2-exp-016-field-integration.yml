name: BOMA ST2-EXP-016 — experimental field and integration Gate D
on:
  pull_request:
    branches: [main]
    paths:
      - 'LAB/payloads/lean/CStage/ST2Exp016*.lean'
      - 'LAB/20_FORMALIZATION/C_STAGE/ST2_EXP_016*'
      - '.github/workflows/boma-st2-exp-016-field-integration.yml'
      - 'LAB/00_ARCHITECTURE/tools/st2_exp_016_gate_e_axioms.py'
  push:
    branches:
      - 'feature/stage-two-st2-exp-016-*'
permissions:
  contents: read
jobs:
  verify:
    name: verify 016 experimental field and integration candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup pinned Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Verify Gate D experimental kernel closure, no new assumptions
        env:
          BOMA_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/boma-st2-exp-016-gate-d
          test "$(git rev-parse HEAD)" = "$BOMA_EXPECTED_HEAD"
          git merge-base --is-ancestor 212f4f87fe02af13ef8fd2ed487e0bec18841d88 HEAD
          git diff --exit-code 212f4f87fe02af13ef8fd2ed487e0bec18841d88 HEAD -- \
            LAB/PDSA/PDSA-ST2-EXP-016_NORM_ANISOTROPY_FROZEN.md \
            LAB/PDSA/plans/ST2-EXP-016/FROZEN_PLAN.json \
            LAB/PDSA/experiments/ST2-EXP-016_BRANCH_ORIGIN_RECORD_001.json
          python3 LAB/00_ARCHITECTURE/tools/lean_dependency_audit.py \
            --stage ST2-EXP-016-FIELD-CANDIDATE \
            --manifest LAB/20_FORMALIZATION/C_STAGE/ST2_EXP_016_FIELD_INPUTS.txt \
            --target BOMA.C.StageTwo.NormAnisotropy016.fieldCertificate016 \
            --target BOMA.C.StageTwo.NormAnisotropy016.nineClaimCandidate016 \
            --target BOMA.C.StageTwo.NormAnisotropy016.nineClaimMeaningCertificate016 \
            --json-out /tmp/boma-st2-exp-016-gate-d/dependency.json \
            | tee /tmp/boma-st2-exp-016-gate-d/console.log
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/boma-st2-exp-016-gate-d/dependency.json'))
          assert p['status']=='PROTOTYPE_PASS' and not p['unresolved'] and not p['internal_axioms']
          names={x['name'] for x in p['internal']}|{x['name'] for x in p['external_boundary']}
          assert not any(x.endswith('.orderTotal') or 'rLE_total_classical' in x for x in names), 'hidden totality dependence'
          print('GATE_D_KERNEL_CANDIDATE_ONLY — semantic Claim audit not yet closed')
          PY
          python3 LAB/00_ARCHITECTURE/tools/st2_exp_016_gate_e_axioms.py \
            --output-dir /tmp/boma-st2-exp-016-gate-d
          test -z "$(git status --porcelain=v1)"
      - name: Upload Gate D output even when blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st2-exp-016-gate-d-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/boma-st2-exp-016-gate-d
          if-no-files-found: warn
